<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1510">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Server</title>
<link rel="manifest" href="/dockerSuite/m/manifest.webmanifest">
<link rel="icon" href="/dockerSuite/m/icon-192.png">
<link rel="apple-touch-icon" href="/dockerSuite/m/icon-192.png">
<style>
:root{--bg:#0b1510;--card:#13221a;--line:#20352a;--text:#e7f3ec;--muted:#8aa597;--green:#22c55e;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--blue:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(11,21,16,.94);backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header img{width:30px;height:30px;border-radius:8px}
header h1{font-size:17px;margin:0;flex:1}
header small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.ibtn{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
.ibtn.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 84px)}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{font-size:20px;display:block}.stat span{color:var(--muted);font-size:12px}
.bar{height:6px;background:#0c1a12;border-radius:4px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}.row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .t span{color:var(--muted);font-size:12.5px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.pill{font-size:12px;padding:2px 8px;border-radius:20px;background:#0c1a12;color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.btn{background:#0c1a12;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 11px;font-size:13px;white-space:nowrap}
.btn:active{background:var(--line)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin-bottom:8px;background:#2a1414;color:#fecaca}
.alert.warn{background:#2a220c;color:#fde68a}.allok{color:var(--ok);display:flex;gap:8px;align-items:center}
.muted{color:var(--muted)}.small{font-size:12.5px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(15,29,21,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:9px 0 8px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav button.on{color:var(--green)}nav svg{width:22px;height:22px}
nav .badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;min-width:16px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 76px);background:#1d3327;border:1px solid var(--line);padding:11px 14px;border-radius:12px;display:none;z-index:9}
#toast.bad{background:#3a1a1a}
.install{display:none;margin-bottom:12px;border-color:#2f6b47}
</style>
</head>
<body>
{% csrf_token %}
<header>
  <img src="/dockerSuite/m/icon-192.png" alt="">
  <h1>Server<small id="sub">Loading...</small></h1>
  <button class="ibtn" id="refresh" aria-label="Refresh"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
</header>
<main>
  <div class="card install" id="installCard"><b>Install as an app</b><p class="muted small" style="margin:6px 0 10px">Adds an icon to your home screen; the app opens without the browser bar.</p><button class="btn" id="installBtn">Install</button></div>

  <section class="view on" id="v-home">
    <div class="card"><h2>Alerts</h2><div id="alerts" class="muted">-</div></div>
    <div class="card"><h2>Server</h2><div class="grid" id="sys"></div></div>
    <div class="card"><h2>Services</h2><div id="svc"></div></div>
  </section>

  <section class="view" id="v-sites"><div class="card"><h2>Websites</h2><div id="sites" class="muted">-</div></div></section>
  <section class="view" id="v-docker"><div class="card"><h2>Containers</h2><div id="docker" class="muted">-</div></div></section>
  <section class="view" id="v-sec">
    <div class="card"><h2>Security</h2><div class="grid" id="secstats"></div></div>
    <div class="card"><h2>Recent logins</h2><div id="logins" class="muted">-</div></div>
    <div class="card"><h2>Plugin protection</h2><div id="guard" class="muted small">-</div></div>
    <div class="card"><a class="btn" href="/" style="text-decoration:none;display:inline-block">Open the full panel</a></div>
  </section>
</main>
<nav>
  <button class="on" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Overview<span class="badge" id="nb" style="display:none"></span></button>
  <button data-v="sites"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>Websites</button>
  <button data-v="docker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="10" width="18" height="10" rx="2"/><path d="M7 10V6h4v4M13 10V6h4v4"/></svg>Docker</button>
  <button data-v="sec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>Security</button>
</nav>
<div id="toast"></div>
<script>
(function () {
  'use strict';
  var API = '/dockerSuite/m/api/';
  var csrf = document.querySelector('[name=csrfmiddlewaretoken]').value;
  var $ = function (id) { return document.getElementById(id); };
  var D = null, loading = false, timer = null;

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) { e.className = cls; } if (text != null) { e.textContent = text; } return e; }
  function hsize(b) { if (!b) { return '0 B'; } var u = ['B', 'KB', 'MB', 'GB', 'TB'], i = 0; while (b >= 1024 && i < 4) { b /= 1024; i++; } return (b >= 10 || i === 0 ? Math.round(b) : b.toFixed(1)) + ' ' + u[i]; }
  function ago(t) { if (!t) { return 'never'; } var s = Date.now() / 1000 - t; if (s < 90) { return 'just now'; } if (s < 5400) { return Math.round(s / 60) + ' min ago'; } if (s < 129600) { return Math.round(s / 3600) + ' h ago'; } return Math.round(s / 86400) + ' days ago'; }
  function dur(s) { var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600); return d ? d + 'd ' + h + 'h' : h + 'h ' + Math.floor(s % 3600 / 60) + 'm'; }
  function toast(text, bad) { var t = $('toast'); t.textContent = text; t.className = bad ? 'bad' : ''; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, 4000); }
  function b64(s) { return btoa(unescape(encodeURIComponent(s))); }

  function post(data) {
    var fd = new FormData(); fd.append('csrfmiddlewaretoken', csrf);
    Object.keys(data).forEach(function (k) { fd.append(k, data[k]); });
    return fetch(API, {method: 'POST', body: fd, credentials: 'same-origin', headers: {'X-Requested-With': 'XMLHttpRequest'}})
      .then(function (r) {
        return r.text().then(function (t) {
          var d = null; try { d = JSON.parse(t); } catch (e) {}
          if (r.status === 403 || (r.redirected && /login|\/$/.test(r.url)) || (d && d.login)) { location.href = '/'; throw new Error('Please log in.'); }
          if (!d) { throw new Error('The server answered HTTP ' + r.status); }
          if (d.ok === false) { throw new Error(d.error || 'Error'); }
          return d;
        });
      });
  }

  function load() {
    if (loading) { return; }
    loading = true; $('refresh').classList.add('spin');
    post({action: 'status'}).then(function (d) { D = d; render(); })
      .catch(function (e) { toast(e.message, true); $('sub').textContent = 'Offline - ' + e.message; })
      .then(function () { loading = false; $('refresh').classList.remove('spin'); });
  }

  function act(what, target, question) {
    if (question && !confirm(question)) { return; }
    toast('Working...');
    post({action: 'act', data64: b64(JSON.stringify({do: what, target: target}))})
      .then(function (d) { toast(d.message || 'Done.'); setTimeout(load, what === 'service' ? 6000 : 1500); })
      .catch(function (e) { toast(e.message, true); });
  }

  function bar(used, total) {
    var p = total ? Math.round(100 * used / total) : 0, b = el('div', 'bar'), i = el('i', p > 90 ? 'bad' : p > 80 ? 'warn' : '');
    i.style.width = p + '%'; b.appendChild(i); return {el: b, p: p};
  }
  function stat(box, label, value, extra) { var s = el('div', 'stat'); s.appendChild(el('b', '', value)); s.appendChild(el('span', '', label)); if (extra) { s.appendChild(extra); } box.appendChild(s); }

  function render() {
    var s = D.system;
    $('sub').textContent = s.host + ' · updated ' + new Date(D.time * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    // alerts
    var a = $('alerts'); a.innerHTML = '';
    if (!D.alerts.length) { var ok = el('div', 'allok'); ok.appendChild(el('span', 'dot ok')); ok.appendChild(el('span', '', 'Everything is working.')); a.appendChild(ok); }
    D.alerts.forEach(function (x) { var r = el('div', 'alert' + (x.level === 'warn' ? ' warn' : '')); r.appendChild(el('span', '', x.level === 'warn' ? '!' : '✕')); r.appendChild(el('span', '', x.text)); a.appendChild(r); });
    var nb = $('nb'), bad = D.alerts.filter(function (x) { return x.level === 'bad'; }).length;
    nb.style.display = bad ? '' : 'none'; nb.textContent = bad;
    // system
    var g = $('sys'); g.innerHTML = '';
    var cpu = Math.round(100 * s.load[0] / s.cpus); var cb = el('div', 'bar'), ci = el('i', cpu > 90 ? 'bad' : cpu > 70 ? 'warn' : ''); ci.style.width = Math.min(cpu, 100) + '%'; cb.appendChild(ci);
    stat(g, 'CPU load (' + s.cpus + ' cores)', cpu + '%', cb);
    var m = bar(s.mem.used, s.mem.total); stat(g, 'Memory ' + hsize(s.mem.used) + ' / ' + hsize(s.mem.total), m.p + '%', m.el);
    var dk = bar(s.disk.used, s.disk.total); stat(g, 'Disk ' + hsize(s.disk.used) + ' / ' + hsize(s.disk.total), dk.p + '%', dk.el);
    stat(g, 'Uptime', dur(s.uptime));
    // services
    var sv = $('svc'); sv.innerHTML = '';
    D.services.forEach(function (x) {
      var r = el('div', 'row'); r.appendChild(el('span', 'dot ' + (x.state === 'active' ? 'ok' : 'bad')));
      var t = el('div', 't'); t.appendChild(el('b', '', x.label)); t.appendChild(el('span', '', x.unit + ' · ' + x.state)); r.appendChild(t);
      if (x.restart) { var b = el('button', 'btn', 'Restart'); b.onclick = function () { act('service', x.unit, 'Restart ' + x.label + ' (' + x.unit + ')?'); }; r.appendChild(b); }
      sv.appendChild(r);
    });
    // sites
    var st = $('sites'); st.innerHTML = '';
    if (!D.websites.length) { st.textContent = 'No websites found.'; }
    D.websites.forEach(function (w) {
      var good = w.http >= 200 && w.http < 400, r = el('div', 'row');
      r.appendChild(el('span', 'dot ' + (good ? 'ok' : 'bad')));
      var t = el('div', 't'); t.appendChild(el('b', '', w.domain));
      var info = (w.http || 'no answer') + ' · ' + w.time + ' s' + (w.wp ? ' · WP ' + w.wp : '') + (w.ssl_days != null ? ' · SSL ' + w.ssl_days + ' d' : '');
      t.appendChild(el('span', '', info)); t.appendChild(el('br'));
      t.appendChild(el('span', '', 'Backup: ' + (w.backup ? ago(w.backup.time) + ' (' + hsize(w.backup.size) + ', ' + w.backup.count + ' kept)' : 'none')));
      r.appendChild(t);
      if (w.wp) { var b = el('button', 'btn', 'Backup'); b.onclick = function () { act('backup', w.domain, 'Back up ' + w.domain + ' now?'); }; r.appendChild(b); }
      var o = el('button', 'btn', 'Open'); o.onclick = function () { window.open('https://' + w.domain + '/', '_blank'); }; r.appendChild(o);
      st.appendChild(r);
    });
    // docker
    var dkb = $('docker'); dkb.innerHTML = '';
    if (!D.containers.length) { dkb.textContent = 'No containers.'; }
    D.containers.forEach(function (c) {
      var r = el('div', 'row'); r.appendChild(el('span', 'dot ' + (c.state === 'running' ? 'ok' : c.state === 'exited' ? 'warn' : 'bad')));
      var t = el('div', 't'); t.appendChild(el('b', '', c.name)); t.appendChild(el('span', '', c.status + ' · ' + c.image)); r.appendChild(t);
      var b = el('button', 'btn', c.state === 'running' ? 'Restart' : 'Start'); b.onclick = function () { act('container', c.name, (c.state === 'running' ? 'Restart' : 'Start') + ' container ' + c.name + '?'); }; r.appendChild(b);
      dkb.appendChild(r);
    });
    // security
    var sc = D.security, ss = $('secstats'); ss.innerHTML = '';
    stat(ss, 'IPs blocked (CrowdSec)', sc.blocked == null ? 'n/a' : String(sc.blocked));
    stat(ss, 'Infected files (ImunifyAV)', sc.infected == null ? 'n/a' : String(sc.infected));
    var lg = $('logins'); lg.innerHTML = '';
    if (!sc.logins.length) { lg.textContent = 'No data.'; }
    sc.logins.forEach(function (l) { var r = el('div', 'row'); var t = el('div', 't'); t.appendChild(el('b', '', l.user + ' from ' + l.from)); t.appendChild(el('span', '', l.when)); r.appendChild(t); lg.appendChild(r); });
    $('guard').textContent = sc.guard || 'No repairs logged - the plugins were never touched.';
  }

  // tabs
  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('nav button').forEach(function (x) { x.classList.toggle('on', x === b); });
      document.querySelectorAll('.view').forEach(function (v) { v.classList.toggle('on', v.id === 'v-' + b.dataset.v); });
      window.scrollTo(0, 0);
    });
  });
  $('refresh').addEventListener('click', load);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { load(); } });
  timer = setInterval(function () { if (!document.hidden) { load(); } }, 60000);

  // install as an app
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; $('installCard').style.display = 'block'; });
  $('installBtn').addEventListener('click', function () { if (deferred) { deferred.prompt(); deferred = null; $('installCard').style.display = 'none'; } });
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/dockerSuite/m/sw.js', {scope: '/dockerSuite/m/'}).catch(function () {}); }

  load();
})();
</script>
</body>
</html>
